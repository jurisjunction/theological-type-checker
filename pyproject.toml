[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "theological-type-checker"
version = "0.4.0"
description = "A deterministic type checker for theological and canonical claims, with an MCP server for LLM-driven use."
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSE"]
dependencies = ["clingo>=5.6,<6"]
keywords = ["theology", "canon law", "answer set programming", "datalog", "mcp", "type system"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Religion",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8", "mcp>=2.2,<3"]

[project.scripts]
ttc-suite = "theological_type_checker.suite:main"
ttc-mcp = "theological_type_checker.server:main"
ttc-check = "theological_type_checker.cli:main"
ttc-library = "theological_type_checker.library:main"
ttc-schools = "theological_type_checker.schools:main"
ttc-coverage = "theological_type_checker.coverage:main"

[project.urls]
Repository = "https://radicle.network/nodes/iris.radicle.network/rad:z9REkMbmisawZ51TYM8PxU9FK3jZ"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
theological_type_checker = ["lp/*.lp", "guide.md"]
